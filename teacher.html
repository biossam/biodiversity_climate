<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선생님 · 생물 다양성과 기후변화</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='46' fill='%235aa7e0'/><path d='M28 42c6-6 14-5 17 0s-2 9 3 13-1 10-7 9-12-6-13-11z' fill='%237cc576'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gothic+A1:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<main class="wrap" id="app"></main>
<script src="data/lessons.js"></script>
<script src="assets/js/common.js"></script>
<script>
(function () {
  var D = BC.data, esc = BC.esc;
  if (BC.student) { location.replace("./"); return; }
  BC.header("teacher");
  var h = '<div style="margin:32px 0 12px"><p class="kicker">수업 운영 안내</p><h1>선생님 화면</h1>' +
    '<p class="mute">' + esc(D.grade) + " · 6차시 · 관련 교과 " + esc(D.subjects) + " · 놀이를 통한 변화(Play2Change)</p>" +
    '<p style="margin-top:12px"><a class="btn c" href="qr.html">📱 학생 전용 주소 · QR</a></p></div>';

  h += '<section class="card"><h2>이 프로젝트는요</h2>' +
    "<p>학생들이 기후 변화와 생물 다양성의 관계를 막연한 먼 미래의 일이 아니라 <b>동물의 삶에 직접 영향을 주는 문제</b>로 느끼도록, 북극곰·꿀벌·벵갈호랑이·바다거북의 사례를 차례로 탐구해요. 차시마다 디자인 싱킹으로 해결책을 구상하고, LEGO Bricks와 재활용 재료로 직접 만들고, 전시회로 나눠요.</p>" +
    "<p style=\"margin:0\">목표는 ‘나의 아이디어와 행동이 세상을 바꿀 수 있다’는 <b>자기 효능감</b>과 일상 속 <b>탄소중립 실천 의지</b>예요.</p></section>";

  h += '<section class="sec"><h2>6차시 한눈에 보기</h2><div class="tscroll"><table class="t"><tr><th>차시</th><th>주제</th><th>핵심 단어</th><th>만들기 활동</th><th>수업</th></tr>' +
    D.lessons.map(function (l) {
      return '<tr><td><a href="lesson.html?l=' + l.no + '#teacher">' + l.no + "차시</a></td><td><b>" + esc(l.title) + "</b></td><td>" + l.terms.map(function (t) { return esc(t.w); }).join(", ") + "</td><td>" + esc(l.make.title) + '<br><span class="mute">예) ' + esc(l.make.ex) + '</span></td><td style="white-space:nowrap"><a class="btn c" style="padding:6px 12px;font-size:14px;--c:' + l.color + '" href="lesson.html?l=' + l.no + '&present=1">🖥 수업 모드</a></td></tr>';
    }).join("") + "</table></div></section>";

  h += '<section class="sec grid g2">' +
    '<div class="card"><h3>성취기준</h3>' + D.standards.map(function (s) { return "<p><b>" + esc(s.code) + "</b> " + esc(s.text) + "</p>"; }).join("") + "</div>" +
    '<div class="card"><h3>지도할 때 유의점</h3><ul style="margin:0;padding-left:20px">' + D.cautions.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") + "</ul></div></section>";

  h += '<section class="sec card"><h2>사이트로 수업하기</h2><ol style="margin:0;padding-left:20px;display:grid;gap:6px">' +
    "<li><b>수업 모드</b> — 차시 화면의 🖥 수업 모드를 누르면 마음 열기 → 공부할 문제 → 영상 → 핵심 단어 → 만들기(타이머) → 전시회 → 퀴즈 → 성찰 → 다음 차시 순서로 크게 띄워져요. ← → 키로 넘기고, Esc로 닫아요.</li>" +
    "<li><b>영상</b> — 차시 화면과 수업 모드에서 바로 재생돼요.</li>" +
    "<li><b>활동지</b> — 학생이 태블릿으로 차시 화면 → 활동지 탭에서 직접 쓰고 아이디어를 스케치해요. 종이로 쓸 때는 🖨 인쇄를 눌러요.</li>" +
    "<li><b>배지</b> — 활동지 ‘다 했어요’ 또는 퀴즈 만점이면 차시 배지를 받아요. 첫 화면과 다짐 카드에 모여요.</li>" +
    "<li><b>놀이터</b> — 서식지 지키기(1~5차시), 지구 온도 조절기(1~2차시), 꿀벌 수분 놀이(3차시), 거북 알 모래 온도(5차시)를 도입이나 정리에 5분쯤 써요.</li>" +
    "<li><b>실천 다짐</b> — 6차시 마무리에 약속 3개를 고르고 일주일 기록을 시작해요. 다짐 카드는 그림으로 저장해 패들렛에 올릴 수 있어요.</li>" +
    '</ol><p class="mute" style="margin:12px 0 0;font-size:14px">학생이 쓴 내용은 모두 그 기기 브라우저에만 저장되고, 어디로도 보내지 않아요.</p></section>';

  h += '<section class="sec grid g2">' +
    '<div class="card"><h3>준비물</h3><p>LEGO Bricks · 재활용 재료(페트병, 상자, 병뚜껑 등) · 활동지 · 아이디어 카드 · 포스트잇 · 패들렛(온라인 갤러리) · 6차시 편지지와 색연필</p></div>' +
    '<div class="card"><h3>설문</h3><p class="mute" style="font-size:14px">수업 자료(지도안)에 있던 Microsoft Forms 설문이에요. 학생 화면에도 1차시 처음과 6차시 끝에 버튼이 있어요. 응답은 이 설문을 만든 사람의 Forms 계정에 모여요.</p>' + D.surveys.map(function (s) { return '<p><a class="btn line" target="_blank" rel="noopener" href="' + esc(s.url) + '">📝 ' + esc(s.label) + "</a></p>"; }).join("") + "</div></section>";

  h += '<section class="sec card"><h3>수업 PPT</h3><p style="margin:0">원본 수업 PPT에는 © The LEGO Group 저작물이 들어 있어 사이트에 올리지 않았어요. 받은 원본 파일을 그대로 쓰세요.</p></section>';
  document.getElementById("app").innerHTML = h;
})();
</script>
</body>
</html>
